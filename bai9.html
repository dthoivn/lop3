<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 9 – Bảo vệ thông tin cá nhân</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.screen{max-width:1000px;margin:auto;padding:20px}
.card{background:#020617;border-radius:20px;padding:25px;text-align:center}

input{padding:10px;border-radius:10px;border:none;margin:5px;width:200px}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.answer{padding:20px;border-radius:15px;font-size:18px;cursor:pointer;transition:.3s}

.a0{background:#ef4444}
.a1{background:#3b82f6}
.a2{background:#facc15;color:black}
.a3{background:#22c55e;color:black}

.zoomCorrect{transform:scale(1.15);box-shadow:0 0 20px #22c55e}
.zoomWrong{opacity:.3}

.progress{height:10px;background:#334155;border-radius:5px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;background:#22c55e;width:0%}

#circleBox{position:relative;width:120px;margin:auto}
#time{position:absolute;top:42px;left:0;width:120px;text-align:center;font-size:22px}

.correctBox{margin-top:10px;color:#22c55e;font-weight:bold}

table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #334155}

canvas{position:fixed;top:0;left:0;pointer-events:none}

button{padding:10px 25px;border-radius:10px;border:none;background:#22c55e;font-size:16px;cursor:pointer;margin-top:15px}
</style>
</head>

<body>

<canvas id="fx"></canvas>

<div class="screen">

<div id="start" class="card">
<h2>🔐 BÀI 9 – BẢO VỆ THÔNG TIN CÁ NHÂN</h2>
<input id="name" placeholder="Tên học sinh">
<input id="cls" placeholder="Lớp"><br>
<button onclick="begin()">BẮT ĐẦU</button>
</div>

<div id="quiz" class="card" style="display:none">

<div class="progress"><div id="bar" class="bar"></div></div>

<div id="circleBox">
<svg width="120" height="120">
<circle cx="60" cy="60" r="50" stroke="#334155" stroke-width="8" fill="none"/>
</svg>
<div id="time">20</div>
</div>

<h3 id="question"></h3>
<div id="remain"></div>
<div class="answers" id="answers"></div>
<div id="correctBox" class="correctBox"></div>

</div>

<div id="end" class="card" style="display:none">
<h2>🎉 HOÀN THÀNH</h2>
<p id="result"></p>

<h3>🏆 BẢNG XẾP HẠNG</h3>
<table id="leaderboard"></table>

<button onclick="location.reload()">LÀM LẠI</button>
</div>

</div>

<script>

const canvas=document.getElementById("fx")
const ctx=canvas.getContext("2d")
canvas.width=innerWidth
canvas.height=innerHeight

function fireworks(){
for(let i=0;i<200;i++){
ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`
ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,6,10)
}
setTimeout(()=>ctx.clearRect(0,0,canvas.width,canvas.height),800)
}

let questions = [

["Thông tin cá nhân là gì?",["Thông tin thời tiết","Thông tin về bản thân","Tin tức","Bài hát"],1],
["Thông tin nào là thông tin cá nhân?",["Ảnh gia đình","Tên và ngày sinh","Tên trường","Bản đồ"],1],
["Thông tin nào thuộc về gia đình?",["Địa chỉ nhà","Bài tập","Tin tức","Tranh"],0],
["Thiết bị nào lưu trữ thông tin?",["Tivi","Máy tính","Quạt","Đèn"],1],
["Điện thoại dùng để làm gì?",["Nấu ăn","Lưu trữ thông tin","Giặt đồ","Chơi thể thao"],1],
["Ảnh của em là loại thông tin gì?",["Thông tin cá nhân","Thông tin công cộng","Tin tức","Không phải thông tin"],0],
["Tên bố mẹ là thông tin gì?",["Thông tin trường học","Thông tin gia đình","Tin tức","Truyện"],1],
["Không nên chia sẻ thông tin cho ai?",["Bạn bè","Người lạ","Thầy cô","Gia đình"],1],
["Thông tin nào không phải cá nhân?",["Tên em","Ảnh em","Tên trường","Ngày sinh"],2],
["Máy tính giúp gì?",["Chơi thể thao","Lưu trữ và trao đổi thông tin","Nấu ăn","Trồng cây"],1],

["Ví dụ thông tin cá nhân?",["Bài hát","Tên và ngày sinh","Thời tiết","Tranh"],1],
["Ví dụ thông tin gia đình?",["Bài tập","Ảnh gia đình","Truyện","Bài hát"],1],
["Kẻ xấu biết thông tin từ đâu?",["Sách","Mạng xã hội","Trường học","Báo"],1],
["Không nên làm gì với link lạ?",["Nhấp vào","Bỏ qua","Chia sẻ","Lưu lại"],0],
["Mật khẩu không nên là gì?",["Số ngẫu nhiên","Ngày sinh","Chữ cái","Ký hiệu"],1],
["Thông tin cá nhân dùng để làm gì?",["Giải trí","Nhận biết bản thân","Nấu ăn","Vẽ tranh"],1],
["Gia đình đi du lịch đăng ảnh có thể gây gì?",["Niềm vui","Nguy hiểm","Học tốt","Chơi vui"],1],
["Ai có thể lợi dụng thông tin?",["Bạn thân","Người lạ","Thầy cô","Cha mẹ"],1],
["Không nên cung cấp gì?",["Đồ ăn","Thông tin cá nhân","Bài hát","Truyện"],1],
["Thiết bị thông minh gồm?",["Xe đạp","Điện thoại","Bàn","Ghế"],1],

["Thông tin nào cần bảo vệ?",["Tin tức","Thông tin cá nhân","Bài hát","Tranh"],1],
["Ví dụ lưu trữ thông tin?",["Sách giấy","Máy tính bảng","Bảng đen","Phấn"],1],
["Ví dụ trao đổi thông tin?",["Facebook","Sách","Bảng","Phấn"],0],
["Thông tin học tập là gì?",["Tên","Điểm số","Địa chỉ","Ảnh"],1],
["Ảnh gia đình thuộc loại gì?",["Công cộng","Gia đình","Trường học","Tin tức"],1],
["Người lạ hỏi thông tin nên?",["Trả lời","Không trả lời","Viết ra","Đăng mạng"],1],
["Mục đích bảo vệ thông tin?",["Chơi game","An toàn","Giải trí","Học bài"],1],
["Thông tin bị lộ có thể?",["An toàn hơn","Bị lợi dụng","Học tốt","Vui hơn"],1],
["Không nên chia sẻ gì?",["Địa chỉ","Truyện","Bài hát","Hình vẽ"],0],
["Thông tin cá nhân gồm?",["Tên","Màu sắc","Âm nhạc","Thức ăn"],0],

["Thông tin gia đình gồm?",["Địa chỉ nhà","Bài hát","Truyện","Tin tức"],0],
["Thiết bị nào không lưu trữ?",["Máy tính","Điện thoại","Quạt","Tablet"],2],
["Trao đổi thông tin qua?",["Zalo","Sách","Bảng","Phấn"],0],
["Nguy cơ khi lộ thông tin?",["Được khen","Bị trộm","Học giỏi","Chơi vui"],1],
["Không nên đặt mật khẩu?",["Khó đoán","Dễ đoán","Dài","Có ký tự"],1],
["Thông tin cá nhân có thể?",["Chia sẻ tùy ý","Bị lợi dụng","Không quan trọng","Luôn an toàn"],1],
["Gia đình nên?",["Chia sẻ hết","Bảo vệ thông tin","Đăng tất cả","Không dùng mạng"],1],
["Thông tin nào cần giữ kín?",["Tên trường","Số điện thoại","Màu sắc","Môn học"],1],
["Kẻ xấu có thể?",["Giúp đỡ","Lừa đảo","Dạy học","Chơi game"],1],
["Không nên làm gì online?",["Học","Chia sẻ thông tin cá nhân","Xem bài","Làm bài"],1],

["Thông tin cá nhân gồm?",["Ngày sinh","Bài hát","Truyện","Tin tức"],0],
["Gia đình cần bảo vệ?",["Thông tin","Đồ ăn","Quần áo","Sách"],0],
["Thiết bị lưu trữ?",["Máy tính","Ghế","Bàn","Quạt"],0],
["Thông tin bị lộ sẽ?",["An toàn","Nguy hiểm","Không sao","Tốt hơn"],1],
["Người lạ trên mạng?",["Tin tưởng","Cẩn thận","Kết bạn hết","Chia sẻ"],1],
["Thông tin giúp gì?",["Nhận biết","Chơi game","Nấu ăn","Ngủ"],0],
["Không nên đăng gì?",["Ảnh riêng","Bài học","Tin tức","Sách"],0],
["Thông tin gia đình là?",["Ảnh gia đình","Tin tức","Bài hát","Truyện"],0],
["Không nên cung cấp?",["Địa chỉ","Môn học","Tên trường","Bài hát"],0],
["Bảo vệ thông tin để?",["An toàn","Giải trí","Chơi","Học ít"],0]

];

while(questions.length<70){
questions.push(...questions.slice(0,10))
}

questions=questions.slice(0,70)

questions.sort(()=>Math.random()-0.5)

let current=0
let score=0
let time=20
let timer

function shuffle(arr){
return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1])
}

function begin(){
start.style.display="none"
quiz.style.display="block"
loadQuestion()
}

function loadQuestion(){

if(current>=questions.length){
finish()
return
}

bar.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

remain.innerText="Còn "+(questions.length-current)+" câu"

let answersData=[...questions[current][1]].map((a,i)=>({text:a,index:i}))
answersData=shuffle(answersData)

answers.innerHTML=""
correctBox.innerHTML=""

answersData.forEach((a,k)=>{
answers.innerHTML+=`<div class="answer a${k}" onclick="selectAnswer(${a.index})">${a.text}</div>`
})

startTimer()

}

function startTimer(){

clearInterval(timer)
time=20
timeEl.innerText=time

timer=setInterval(()=>{
time--
timeEl.innerText=time

if(time<=0){
clearInterval(timer)
showAnswer(null)
}

},1000)

}

const timeEl=document.getElementById("time")

function selectAnswer(index){
clearInterval(timer)
showAnswer(index)
}

function showAnswer(index){

let correct=questions[current][2]
let correctText=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{
if(el.innerText===correctText) el.classList.add("zoomCorrect")
else el.classList.add("zoomWrong")
})

if(index===correct) score++

correctBox.innerText="👉 Câu trả lời đúng là: "+correctText

setTimeout(()=>{
current++
loadQuestion()
},1500)

}

function finish(){

quiz.style.display="none"
end.style.display="block"

let n=name.value||"HS"
let c=cls.value||""

result.innerText=n+" ("+c+") đạt "+score+"/70 điểm"

fireworks()

let board=JSON.parse(localStorage.board||"[]")
board.push({name:n,cls:c,score})

board.sort((a,b)=>b.score-a.score)
board=board.slice(0,10)

localStorage.board=JSON.stringify(board)

let html="<tr><th>Hạng</th><th>Tên</th><th>Lớp</th><th>Điểm</th></tr>"

board.forEach((b,i)=>{
html+=`<tr><td>${i+1}</td><td>${b.name}</td><td>${b.cls}</td><td>${b.score}</td></tr>`
})

leaderboard.innerHTML=html
}

</script>

</body>
</html>
