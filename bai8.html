<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tin học 3 – Bài 8</title>
<style>
body{
margin:0;
font-family:Arial;
color:white;
overflow-x:hidden;

/* ===== NỀN CỜ VIỆT NAM ===== */
background:
linear-gradient(red,red);
}

/* sao vàng */
body::before{
content:"★";
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:300px;
color:yellow;
opacity:0.9;
z-index:-1;
}

.screen{max-width:1000px;margin:auto;padding:20px}
.card{background:rgba(2,6,23,0.85);border-radius:20px;padding:25px;text-align:center}
input{padding:10px;border-radius:10px;border:none;margin:5px;width:200px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.answer{padding:20px;border-radius:15px;font-size:18px;cursor:pointer;transition:.3s}
.a0{background:#ef4444}.a1{background:#3b82f6}.a2{background:#facc15;color:black}.a3{background:#22c55e;color:black}

/* ZOOM ĐÚNG */
.zoomCorrect{
animation: zoomPulse .6s infinite alternate;
box-shadow:0 0 25px #22c55e;
}
@keyframes zoomPulse{
from{transform:scale(1);}
to{transform:scale(1.2);}
}
.zoomWrong{opacity:.3}

.progress{height:10px;background:#334155;border-radius:5px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;background:#22c55e;width:0%}
#circleBox{position:relative;width:120px;margin:auto}
#time{position:absolute;top:42px;left:0;width:120px;text-align:center;font-size:22px}

canvas{position:fixed;top:0;left:0;pointer-events:none}

button{padding:10px 25px;border-radius:10px;border:none;background:#22c55e;font-size:16px;cursor:pointer;margin-top:15px}
</style>
</head>
<body>

<!-- TUYẾT -->
<canvas id="snow"></canvas>

<!-- PHÁO HOA -->
<canvas id="fx"></canvas>

<div class="screen">
<div id="start" class="card">
<h2>🧠 TIN HỌC 3 – BÀI 8 – LÀM QUEN VỚI THƯ MỤC</h2>
<input id="name" placeholder="Tên học sinh">
<input id="cls" placeholder="Lớp"><br>
<button onclick="begin()">BẮT ĐẦU</button>
</div>

<div id="quiz" class="card" style="display:none">
<div class="progress"><div id="bar" class="bar"></div></div>

<div id="circleBox">
<svg width="120" height="120">
<circle cx="60" cy="60" r="50" stroke="#334155" stroke-width="8" fill="none"/>
<circle cx="60" cy="60" r="50" stroke="#22c55e" stroke-width="8" stroke-dasharray="314" fill="none"/>
</svg>
<div id="time">20</div>
</div>

<h3 id="question"></h3>
<div id="remain"></div>
<div class="answers" id="answers"></div>
</div>

<div id="end" class="card" style="display:none">
<h2>🎉 HOÀN THÀNH</h2>
<p id="result"></p>
<button onclick="location.reload()">LÀM LẠI</button>
</div>
</div>

<script>
/* ===== TUYẾT RƠI ===== */
const snowCanvas=document.getElementById("snow");
const snowCtx=snowCanvas.getContext("2d");
snowCanvas.width=window.innerWidth;
snowCanvas.height=window.innerHeight;

let snowflakes=[];
for(let i=0;i<120;i++){
snowflakes.push({
x:Math.random()*snowCanvas.width,
y:Math.random()*snowCanvas.height,
r:Math.random()*4+1,
d:Math.random()*1
});
}

function drawSnow(){
snowCtx.clearRect(0,0,snowCanvas.width,snowCanvas.height);
snowCtx.fillStyle="white";
snowCtx.beginPath();
snowflakes.forEach(f=>{
snowCtx.moveTo(f.x,f.y);
snowCtx.arc(f.x,f.y,f.r,0,Math.PI*2,true);
});
snowCtx.fill();
moveSnow();
}
let angle=0;
function moveSnow(){
angle+=0.01;
snowflakes.forEach((f,i)=>{
f.y+=Math.cos(angle+f.d)+1+f.r/2;
f.x+=Math.sin(angle)*2;
if(f.y>snowCanvas.height){
snowflakes[i]={x:Math.random()*snowCanvas.width,y:0,r:f.r,d:f.d};
}
});
}
setInterval(drawSnow,33);

/* ===== PHÁO HOA ===== */
const canvas=document.getElementById("fx");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let particles=[];

function createFirework(){
let x=Math.random()*canvas.width;
let y=Math.random()*canvas.height/2;
for(let i=0;i<80;i++){
particles.push({
x:x,y:y,
angle:Math.random()*2*Math.PI,
speed:Math.random()*5+2,
radius:Math.random()*3+1,
alpha:1,
hue:Math.random()*360
});
}
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach((p,index)=>{
p.x+=Math.cos(p.angle)*p.speed;
p.y+=Math.sin(p.angle)*p.speed;
p.alpha-=0.02;
ctx.beginPath();
ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
ctx.fillStyle=`hsla(${p.hue},100%,50%,${p.alpha})`;
ctx.fill();
if(p.alpha<=0)particles.splice(index,1);
});
requestAnimationFrame(animate);
}
animate();

/* ===== QUIZ ===== */
let questions=[
['Trong máy tính có thể có gì?',['Nhiều ổ đĩa','Chỉ một ổ','Không có ổ','Chỉ thư mục'],0]
];
while(questions.length<70)questions.push(...questions.slice(0));
questions=questions.slice(0,70);
questions.sort(()=>Math.random()-0.5);

let cur=0,score=0,time=20,timer;
const bar=document.getElementById('bar');

function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);}
function begin(){start.style.display='none';quiz.style.display='block';load();}
function load(){
if(cur>=70){finish();return;}
bar.style.width=(cur/70*100)+'%';
question.innerText='Câu '+(cur+1)+': '+questions[cur][0];
remain.innerText='Còn '+(70-cur)+' câu';
let arr=shuffle(questions[cur][1].map((t,i)=>({t,i})));
answers.innerHTML='';
arr.forEach((o,k)=>answers.innerHTML+=`<div class="answer a${k}" onclick="pick(${o.i})">${o.t}</div>`);
startTimer();
}
function startTimer(){
clearInterval(timer);
time=20;
timer=setInterval(()=>{
time--;
time<=0&&(clearInterval(timer),show(null));
document.getElementById('time').innerText=time;
},1000);
}
function pick(i){clearInterval(timer);show(i);}
function show(i){
let c=questions[cur][2];
let correctText=questions[cur][1][c];
let fb=document.createElement('div');
fb.style.marginTop='10px';
fb.style.color='#22c55e';
fb.innerHTML='👉 Câu trả lời đúng là: <b>'+correctText+'</b>';
answers.appendChild(fb);

document.querySelectorAll('.answer').forEach(x=>{
if(x.innerText==correctText)x.classList.add('zoomCorrect');
else x.classList.add('zoomWrong');
});
if(i===c)score++;
setTimeout(()=>{cur++;load();},1200);
}
function finish(){
quiz.style.display='none';
end.style.display='block';
result.innerText=(name.value||'HS')+' ('+(cls.value||'')+') đạt '+score+'/70';
let fxInterval=setInterval(createFirework,600);
setTimeout(()=>clearInterval(fxInterval),5000);
}
</script>

</body>
</html>
