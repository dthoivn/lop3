<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tin học 3 – Bài 8</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;overflow-x:hidden}
.screen{max-width:1000px;margin:auto;padding:20px}
.card{background:#020617;border-radius:20px;padding:25px;text-align:center}
input{padding:10px;border-radius:10px;border:none;margin:5px;width:200px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.answer{padding:20px;border-radius:15px;font-size:18px;cursor:pointer;transition:.3s}
.a0{background:#ef4444}.a1{background:#3b82f6}.a2{background:#facc15;color:black}.a3{background:#22c55e;color:black}
.zoomWrong{opacity:.3}

@keyframes zoomPulse{
0%{transform:scale(1)}
50%{transform:scale(1.25)}
100%{transform:scale(1)}
}

.zoomCorrect{
animation:zoomPulse .6s ease-in-out 2;
box-shadow:0 0 25px #22c55e;
}

.progress{height:10px;background:#334155;border-radius:5px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;background:#22c55e;width:0%}
#circleBox{position:relative;width:120px;margin:auto}
#time{position:absolute;top:42px;left:0;width:120px;text-align:center;font-size:22px}
button{padding:10px 25px;border-radius:10px;border:none;background:#22c55e;font-size:16px;cursor:pointer;margin-top:15px}

/* ===== TUYẾT ===== */
.snow{
position:fixed;
top:-10px;
color:white;
font-size:10px;
user-select:none;
pointer-events:none;
animation:fall linear forwards;
}

@keyframes fall{
to{transform:translateY(100vh);}
}
</style>
</head>
<body>

<div class="screen">
<div id="start" class="card">
<h2>🧠 TIN HỌC 3 – BÀI 8 – LÀM QUEN VỚI THƯ MỤC</h2>
<input id="name" placeholder="Tên học sinh">
<input id="cls" placeholder="Lớp"><br>
<button onclick="begin()">BẮT ĐẦU</button>
</div>

<div id="quiz" class="card" style="display:none">
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="circleBox">
<svg width="120" height="120">
<circle cx="60" cy="60" r="50" stroke="#334155" stroke-width="8" fill="none"/>
<circle id="ring" cx="60" cy="60" r="50" stroke="#22c55e" stroke-width="8"
stroke-dasharray="314" stroke-dashoffset="0" fill="none"/>
</svg>
<div id="time">20</div>
</div>

<h3 id="question"></h3>
<div id="remain"></div>
<div class="answers" id="answers"></div>
</div>

<div id="end" class="card" style="display:none">
<h2>🎉 HOÀN THÀNH</h2>
<p id="result"></p>
<button onclick="location.reload()">LÀM LẠI</button>
</div>
</div>

<script>
// ===== DANH SÁCH CÂU HỎI =====
let questions = [

["Thư mục là gì?",["Nơi chứa tệp và thư mục con","Thiết bị lưu trữ","Một loại phần mềm","Một trò chơi"],0],
["Ổ đĩa là gì?",["Thiết bị nhập","Nơi lưu trữ dữ liệu","Thiết bị xuất","Phần mềm"],1],
["Ví dụ ổ đĩa?",["(C:)","Word","Chuột","Bàn phím"],0],
["Trong ổ đĩa có gì?",["Chỉ có tệp","Chỉ có thư mục","Thư mục và tệp","Không có gì"],2],
["Thư mục có thể chứa?",["Chỉ tệp","Thư mục con và tệp","Chỉ thư mục","Không gì"],1],
["Biểu tượng thư mục giống gì?",["Quyển sách","Cái kẹp giấy màu vàng","Chiếc bút","Cái bàn"],1],
["Thư mục gốc là gì?",["Thư mục nhỏ nhất","Ổ đĩa","Tệp lớn nhất","Thư mục con"],1],
["Thư mục Gia sach là?",["Thư mục con","Thư mục mẹ","Tệp","Ổ đĩa"],1],
["Thư mục con của Gia sach?",["Sach, Vo bai tap","C:, D:","Toan 3","Chuột"],0],
["Tệp là gì?",["Thiết bị","Thông tin lưu trữ","Phần mềm","Thư mục"],1],

["Ví dụ tệp?",["Toan 3","C:","D:","Gia sach"],0],
["Cách mở thư mục?",["Nháy chuột","Gõ bàn phím","Chạm màn hình","Tắt máy"],0],
["Khung trái hiển thị?",["Nội dung","Cây thư mục","Video","Âm thanh"],1],
["Khung phải hiển thị?",["Cây thư mục","Nội dung thư mục","Ổ đĩa","Bàn phím"],1],
["Cây thư mục là gì?",["Sơ đồ lưu trữ","Phần mềm","Thiết bị","Trò chơi"],0],
["Cây thư mục giúp?",["Chơi game","Dễ tìm thông tin","Xem phim","Nghe nhạc"],1],
["Cách sắp xếp thông tin?",["Ngẫu nhiên","Theo sơ đồ cây","Theo màu","Theo kích thước"],1],
["Ổ đĩa thường có tên?",["A,B,C","C:, D:, E:","1,2,3","X,Y,Z"],1],
["Để mở tệp cần?",["Nháy chuột","Tắt máy","Rút điện","Đóng máy"],0],
["Tệp Tieng Viet 3 nằm ở?",["Ổ C","Ổ D","Ổ E","Ổ F"],1],

["Các bước tìm tệp?",["Mở ổ → thư mục → tệp","Mở tệp trước","Tắt máy","Không cần"],0],
["Số bước tìm tệp?",["2","3","4","5"],2],
["Ổ đĩa chứa?",["Tệp và thư mục","Chỉ tệp","Chỉ thư mục","Không gì"],0],
["Thư mục chứa?",["Thư mục con và tệp","Chỉ tệp","Chỉ thư mục","Không gì"],0],
["Tạo thư mục bằng?",["New folder","Delete","Rename","Copy"],0],
["Đổi tên thư mục?",["Rename","Delete","Open","Save"],0],
["Xóa thư mục?",["Delete","Copy","Paste","Open"],0],
["Sau khi tạo thư mục cần?",["Nhập tên","Xóa","Đóng máy","Restart"],0],
["Phím xác nhận?",["Enter","Shift","Ctrl","Alt"],0],
["Thư mục con là?",["Trong thư mục khác","Ổ đĩa","Tệp","Thiết bị"],0],

["Cây thư mục giúp?",["Khó tìm","Dễ tìm","Không liên quan","Làm chậm"],1],
["Ổ đĩa là thư mục?",["Sai","Đúng","Có thể","Không biết"],1],
["Trong thư mục không thể?",["Chứa tệp","Chứa thư mục con","Chứa ổ đĩa","Chứa dữ liệu"],2],
["Thư mục có thể?",["Trùng tên","Không trùng tên","Bắt buộc trùng","Không có tên"],1],
["Tên thư mục?",["Tùy ý","Phải giống nhau","Không đặt được","Luôn số"],0],
["File Explorer dùng để?",["Quản lý tệp","Chơi game","Xem phim","Nghe nhạc"],0],
["Mở ổ đĩa bằng?",["Nháy chuột","Gõ phím","Hét","Vẽ"],0],
["Ổ đĩa D: chứa?",["Thư mục","Tệp","Cả hai","Không gì"],2],
["Thư mục mẹ chứa?",["Thư mục con","Ổ đĩa","Chuột","Bàn"],0],
["Tệp không phải?",["Dữ liệu","Thư mục","File","Thông tin"],1],

["Cây thư mục giống?",["Cây thật","Sơ đồ cây","Nhà","Xe"],1],
["Sắp xếp thông tin giúp?",["Nhanh tìm","Chậm hơn","Khó hơn","Không đổi"],0],
["Thư mục gốc chứa?",["Thư mục và tệp","Chỉ tệp","Chỉ thư mục","Không gì"],0],
["Tìm tệp cần?",["Theo thứ tự","Ngẫu nhiên","Không cần","Đoán"],0],
["Tạo thư mục ở đâu?",["Trong thư mục","Ngoài máy","Trên bàn","Trong sách"],0],
["Đổi tên cần?",["Chọn thư mục","Xóa máy","Tắt máy","Rút điện"],0],
["Xóa thư mục sẽ?",["Mất dữ liệu","Giữ nguyên","Tăng dữ liệu","Không đổi"],0],
["Thư mục giúp?",["Lưu trữ","Chơi game","Nấu ăn","Nghe nhạc"],0],
["Tệp là đơn vị?",["Lưu trữ","Chơi","Học","Viết"],0],
["Máy tính lưu trữ bằng?",["Thư mục và tệp","Giấy","Sách","Bảng"],0]

];

while(questions.length<70)questions.push(...questions.slice(0));
questions=questions.slice(0,70);
questions.sort(()=>Math.random()-0.5);

let cur=0,score=0,time=20,timer;
const bar=document.getElementById('bar');

function shuffle(a){
return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
}

function begin(){
start.style.display='none';
quiz.style.display='block';
load();
}

function load(){
if(cur>=70){finish();return;}
bar.style.width=(cur/70*100)+'%';
question.innerText='Câu '+(cur+1)+': '+questions[cur][0];
remain.innerText='Còn '+(70-cur)+' câu';

let arr=shuffle(questions[cur][1].map((t,i)=>({t,i})));
answers.innerHTML='';
arr.forEach((o,k)=>
answers.innerHTML+=`<div class="answer a${k}" onclick="pick(${o.i},this)">${o.t}</div>`
);
startTimer();
}

function startTimer(){
clearInterval(timer);
time=20;
timer=setInterval(()=>{
time--;
document.getElementById('time').innerText=time;
if(time<=0){
clearInterval(timer);
show(null);
}
},1000);
}

function pick(i,e){
clearInterval(timer);
show(i,e);
}

function show(i,e){
let c=questions[cur][2];
let correctText=questions[cur][1][c];

let fb=document.createElement('div');
fb.style.marginTop='10px';
fb.style.color='#22c55e';
fb.innerHTML='👉 Câu trả lời đúng là: <b>'+correctText+'</b>';
answers.appendChild(fb);

document.querySelectorAll('.answer').forEach(x=>{
if(x.innerText==correctText)
x.classList.add('zoomCorrect');
else
x.classList.add('zoomWrong');
});

if(i===c){
score++;
snowEffect(); // gọi tuyết khi đúng
}

setTimeout(()=>{
cur++;
load();
},1500);
}

function finish(){
quiz.style.display='none';
end.style.display='block';
let n=name.value||'HS';
let c=cls.value||'';
result.innerText=n+' ('+c+') đạt '+score+'/70';
}

// ===== HIỆU ỨNG TUYẾT =====
function snowEffect(){
for(let i=0;i<40;i++){
let s=document.createElement('div');
s.className='snow';
s.innerHTML='❄';
s.style.left=Math.random()*100+'vw';
s.style.fontSize=(10+Math.random()*20)+'px';
s.style.animationDuration=(2+Math.random()*3)+'s';
document.body.appendChild(s);
setTimeout(()=>s.remove(),5000);
}
}
</script>
</body>
</html>
