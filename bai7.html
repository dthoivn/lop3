<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>🎮 Game kiểm tra – Sắp xếp để dễ tìm (Lớp 3)</title>
<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#fab1a0,#74b9ff)}
#app{max-width:1050px;margin:20px auto;background:#fff;border-radius:18px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{text-align:center;color:#2d3436}
#top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#progress{flex:1;height:12px;background:#dfe6e9;border-radius:10px;overflow:hidden;margin:0 15px}
#bar{height:100%;width:0%;background:linear-gradient(90deg,#ffeaa7,#00b894);transition:.4s}
#timer{font-weight:bold;color:#d63031}
.question{font-size:20px;margin:20px 0}
.answers button{display:block;width:100%;margin:10px 0;padding:12px;border:none;border-radius:14px;font-size:16px;cursor:pointer;background:#f1f2f6;transition:.25s}
.answers button:hover{background:#dff9fb;transform:scale(1.02)}
.correct{background:#c8e6c9 !important}
.wrong{background:#ffcdd2 !important}
#next{display:none;margin:20px auto;padding:10px 40px;font-size:16px;border:none;border-radius:20px;background:#0984e3;color:#fff;cursor:pointer}
#result{display:none;text-align:center;font-size:22px}
#report{display:none;margin-top:20px}
#report table{width:100%;border-collapse:collapse}
#report th,#report td{border:1px solid #ccc;padding:6px;text-align:center}
</style>
</head>
<body>
<div id="app">
<h1>🎮 GAME KIỂM TRA – SẮP XẾP ĐỂ DỄ TÌM (LỚP 3)</h1>
<div id="top">
  <div id="timer">⏱️ 15:00</div>
  <div id="progress"><div id="bar"></div></div>
</div>
<div id="quiz">
  <div class="question" id="question"></div>
  <div class="answers" id="answers"></div>
</div>
<button id="next">Câu tiếp theo ▶</button>
<div id="result"></div>
<div id="report"></div>
</div>
<script>
// ====== 70 CÂU KHÔNG TRÙNG – BÀI 7 LỚP 3 ======
let questions = [

["Sắp xếp giúp gì?",["Làm chậm","Dễ tìm hơn","Khó hơn","Không thay đổi"],1],
["Hình nào tìm nhanh hơn?",["Hình chưa sắp xếp","Hình đã sắp xếp","Cả hai","Không hình nào"],1],
["Các thẻ số nên sắp xếp theo?",["Màu sắc","Thứ tự tăng dần","Kích thước","Ngẫu nhiên"],1],
["Tìm thẻ nhanh cần?",["Sắp xếp","Bỏ đi","Giấu đi","Xóa"],0],
["Phân loại là gì?",["Gộp lại","Chia theo nhóm","Xóa","Đổi tên"],1],
["Thẻ số và chữ nên?",["Trộn lẫn","Phân riêng","Xóa","Giữ nguyên"],1],
["Sắp xếp chữ theo?",["Ngẫu nhiên","Bảng chữ cái","Màu sắc","Kích thước"],1],
["Muốn tìm nhanh cần?",["Sắp xếp hợp lí","Để lộn xộn","Giấu","Xóa"],0],
["Đồ vật nên được?",["Bỏ lung tung","Phân loại","Xóa","Giấu"],1],
["Sau khi phân loại cần?",["Xóa","Sắp xếp","Bỏ","Giấu"],1],

["Tìm đồ vật cần?",["Tìm ngẫu nhiên","Tìm theo thứ tự","Không tìm","Đoán"],1],
["Sắp xếp sách theo?",["Màu","ABC","Kích thước","Ngẫu nhiên"],1],
["Ngăn sách dùng để?",["Để bút","Để sách","Để đồ ăn","Để đồ chơi"],1],
["Ngăn vở dùng để?",["Để vở","Để sách","Để bút","Để đồ chơi"],0],
["Đồ dùng học tập nên?",["Để riêng","Trộn lẫn","Bỏ đi","Giấu"],0],
["Giá sách hợp lí khi?",["Lộn xộn","Phân loại rõ","Không có ngăn","Trộn tất cả"],1],
["Tìm sách nhanh cần?",["Tìm ngẫu nhiên","Theo thứ tự","Bỏ đi","Giấu"],1],
["Bát đĩa nên?",["Trộn lẫn","Phân loại","Xóa","Giấu"],1],
["Đĩa nên để?",["Ngăn bát","Ngăn đĩa","Ngăn bút","Ngăn sách"],1],
["Đũa nên để?",["Ống đũa","Ngăn bát","Ngăn sách","Ngăn vở"],0],

["Thìa nên để?",["Ống thìa","Ngăn sách","Ngăn vở","Ngăn bút"],0],
["Bát đĩa nên sắp xếp theo?",["Kích thước","Màu","Ngẫu nhiên","Tên"],0],
["Sắp xếp giúp?",["Chậm hơn","Nhanh hơn","Không đổi","Khó hơn"],1],
["Phân loại dựa vào?",["Đặc điểm","Màu","Tên","Âm thanh"],0],
["Cách tìm đồ?",["Theo ngăn","Ngẫu nhiên","Bỏ","Giấu"],0],
["Sơ đồ cây là?",["Trò chơi","Cách biểu diễn","Thiết bị","Phần mềm"],1],
["Sơ đồ cây giúp?",["Khó hiểu","Dễ hiểu","Không dùng","Sai"],1],
["Gốc cây là?",["Nhánh nhỏ","Vị trí đầu","Ngọn cây","Lá"],1],
["Nhánh cây là?",["Phần nhỏ","Phần lớn","Không liên quan","Sai"],0],
["Các nhánh cùng cấp?",["Khác nhau","Ngang nhau","Trên dưới","Không liên quan"],1],

["Ngăn tủ là?",["Nhánh cây","Gốc cây","Lá cây","Không phải"],0],
["Áo sơ mi thuộc?",["Ngăn áo","Ngăn bát","Ngăn sách","Ngăn vở"],0],
["Quần dài thuộc?",["Ngăn áo","Ngăn quần","Ngăn sách","Ngăn bút"],1],
["Quần áo thể thao là?",["Nhánh con","Gốc","Không liên quan","Sai"],0],
["Sơ đồ cây dùng để?",["Phân loại","Xóa","Giấu","Bỏ"],0],
["Cặp sách nên?",["Lộn xộn","Sắp xếp","Bỏ","Giấu"],1],
["Ngăn to nhất để?",["SGK","Bút","Thìa","Đũa"],0],
["Ngăn giữa để?",["Vở","Bút","Thìa","Đĩa"],0],
["Ngăn nhỏ để?",["Đồ dùng","Sách","Vở","Bàn"],0],
["Sắp xếp SGK theo?",["Môn học","Màu","Kích thước","Ngẫu nhiên"],0],

["Sắp xếp vở theo?",["Môn học","Màu","Tên","Ngẫu nhiên"],0],
["Tìm đồ trong cặp?",["Theo ngăn","Ngẫu nhiên","Đoán","Bỏ"],0],
["Tủ lạnh nên?",["Trộn lẫn","Phân loại","Bỏ","Giấu"],1],
["Tìm bài trong sách?",["Theo mục lục","Ngẫu nhiên","Bỏ","Giấu"],0],
["Mục lục giúp?",["Khó tìm","Dễ tìm","Không cần","Sai"],1],
["Trang sách sắp xếp?",["Giảm dần","Tăng dần","Ngẫu nhiên","Không"],1],
["Quần áo nên?",["Phân loại","Trộn","Bỏ","Giấu"],0],
["Sắp xếp hợp lí giúp?",["Nhanh tìm","Chậm tìm","Không đổi","Sai"],0],
["Không sắp xếp sẽ?",["Nhanh","Khó tìm","Dễ tìm","Không đổi"],1],
["Phân loại giúp?",["Dễ tìm","Khó tìm","Không đổi","Sai"],0]

];

// TRỘN CÂU HỎI
questions.sort(()=>Math.random()-0.5);
let index=0,score=0;let details=[];
const qEl=document.getElementById('question');
const aEl=document.getElementById('answers');
const bar=document.getElementById('bar');
const next=document.getElementById('next');
const result=document.getElementById('result');
const report=document.getElementById('report');

// ĐẾM NGƯỢC 15 PHÚT
let total=15*60;const timerEl=document.getElementById('timer');
const countdown=setInterval(()=>{total--;let m=Math.floor(total/60),s=total%60;timerEl.textContent=`⏱️ ${m}:${s.toString().padStart(2,'0')}`;if(total<=0){clearInterval(countdown);finish();}},1000);

function shuffle(arr){return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);}
function load(){next.style.display='none';const q=questions[index];qEl.textContent=`Câu ${index+1}: ${q.q}`;aEl.innerHTML='';const answers=shuffle(q.a.map((t,i)=>({t,i})));answers.forEach(obj=>{const b=document.createElement('button');b.textContent=obj.t;b.onclick=()=>choose(b,obj.i,q.c,q.q,obj.t);aEl.appendChild(b)});bar.style.width=(index/questions.length*100)+'%';}
function choose(btn,choice,correct,qtext,ans){[...aEl.children].forEach(b=>b.disabled=true);const ok=choice===correct;btn.classList.add(ok?'correct':'wrong');if(!ok){[...aEl.children].find(b=>b.textContent===questions[index].a[correct]).classList.add('correct');}if(ok)score++;details.push({q:qtext,choose:ans,correct:questions[index].a[correct],ok});next.style.display='block';}
next.onclick=()=>{index++;if(index<questions.length)load();else finish();};
function finish(){clearInterval(countdown);document.getElementById('quiz').style.display='none';next.style.display='none';bar.style.width='100%';result.style.display='block';result.innerHTML=`🎉 Hoàn thành!<br>Điểm: <b>${score}/${questions.length}</b>`;report.style.display='block';let html='<h3>📊 BÁO CÁO CHI TIẾT</h3><table><tr><th>Câu</th><th>Đáp án HS</th><th>Đáp án đúng</th><th>Kết quả</th></tr>';details.forEach((d,i)=>{html+=`<tr><td>${i+1}</td><td>${d.choose}</td><td>${d.correct}</td><td>${d.ok?'✔':'✘'}</td></tr>`});html+='</table>';report.innerHTML=html;}
load();
</script>
</body>
</html>
