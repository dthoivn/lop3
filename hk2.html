<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Thi Tin học lớp 3</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.container {
    max-width: 900px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h1, h2 {
    text-align: center;
}

.question {
    background: #f1f5ff;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    transition: 0.3s;
}

.question:hover {
    transform: scale(1.02);
}

label {
    display: block;
    padding: 6px;
    cursor: pointer;
}

button {
    display: block;
    margin: 20px auto;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: #4facfe;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #00c6ff;
}

#result {
    text-align: center;
    font-weight: bold;
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

<h1>ĐỀ KIỂM TRA TIN HỌC LỚP 3</h1>

<p>Họ tên: <input type="text" id="hoten"></p>

<form id="quizForm"></form>

<button onclick="submitQuiz()">NỘP BÀI</button>

<p id="result"></p>

</div>

<script>
let submitted = false;

const questions = [
{
q: "Ví dụ nào là thông tin gia đình?",
name: "q1",
a: [
{t:"Địa chỉ, số điện thoại", v:"A"},
{t:"Dự báo thời tiết", v:"B"},
{t:"Kết quả bóng đá", v:"C"}
],
correct:"A"
},
{
q: "Biểu tượng của PowerPoint là?",
name: "q2",
a: [
{t:"A", img:"https://i.postimg.cc/sGYsfb3w/cau2b.jpg", v:"A"},
{t:"B", img:"https://i.postimg.cc/30XYrz31/cau2a.jpg", v:"B"},
{t:"C", img:"https://i.postimg.cc/wtM8dY5G/L3-2C.jpg", v:"C"}
],
correct:"B"
},
{
q: "Ngăn kéo giống cái gì trong máy tính?",
name: "q3",
a: [
{t:"Màn hình", v:"A"},
{t:"Tệp tin", v:"B"},
{t:"Thư mục", v:"C"}
],
correct:"C"
},
{
q: "Công việc nào cần máy tính?",
name: "q4",
a: [
{t:"Quan sát cây", v:"A"},
{t:"Kể chuyện", v:"B"},
{t:"Tìm thông tin Internet", v:"C"}
],
correct:"C"
},
{
q: "Tư thế cầm chuột đúng?",
name: "q5",
a: [
{img:"https://i.postimg.cc/GBtw1nP6/L3-5A.png", v:"A"},
{img:"https://i.postimg.cc/XZqS06Km/L3-5B.png", v:"B"},
{img:"https://i.postimg.cc/WDzLPcmK/L3-5C.png", v:"C"}
],
correct:"B"
},
{
q: "Chia sẻ thông tin cho người lạ?",
name: "q6",
a: [
{t:"Không sao", v:"A"},
{t:"Có thể bị lừa", v:"B"},
{t:"Được giúp đỡ", v:"C"}
],
correct:"B"
},
{
q: "Hình mô tả hành động gì?",
name: "q7",
img:"https://i.postimg.cc/1VPvspxb/L3-7.png",
a: [
{t:"Rửa tay", v:"A"},
{t:"Tắm", v:"B"},
{t:"Uống nước", v:"C"}
],
correct:"A"
},
{
q: "Tắt máy đúng cách?",
name: "q8",
a: [
{t:"Chọn Power → Shutdown", v:"A"},
{t:"Start → Power → Shutdown → tắt màn hình", v:"B"},
{t:"Start → Power → Shutdown", v:"C"}
],
correct:"C"
}
];

// random câu hỏi
questions.sort(() => Math.random() - 0.5);

// render
const form = document.getElementById("quizForm");

questions.forEach((item, index) => {
let div = document.createElement("div");
div.className = "question";

let html = `<b>Câu ${index+1}:</b> ${item.q}<br>`;

if(item.img){
html += `<img src="${item.img}" width="120"><br>`;
}

// random đáp án
item.a.sort(() => Math.random() - 0.5);

item.a.forEach(ans=>{
html += `<label>
<input type="radio" name="${item.name}" value="${ans.v}">
${ans.t ? ans.t : ""}
${ans.img ? `<br><img src="${ans.img}" width="100">` : ""}
</label>`;
});

div.innerHTML = html;
form.appendChild(div);
});

// câu 9
form.innerHTML += `
<div class="question">
<b>Câu 9:</b> Đúng/Sai<br>
A. Thầy cô hỏi địa chỉ <input type="text" id="cauA"><br>
B. Người lạ hỏi số điện thoại <input type="text" id="cauB"><br>
C. Bạn hỏi bài <input type="text" id="cauC"><br>
</div>
`;

function submitQuiz(){
if(submitted){
alert("Bạn đã nộp bài rồi!");
return;
}

let name = document.getElementById("hoten").value;
if(name === ""){
alert("Nhập tên!");
return;
}

let score = 0;

// kiểm tra hết chưa
for(let q of questions){
let selected = document.querySelector(`input[name="${q.name}"]:checked`);
if(!selected){
alert("Bạn chưa làm hết câu!");
return;
}
if(selected.value === q.correct) score++;
}

// câu 9
if(document.getElementById("cauA").value.toLowerCase() === "đúng") score++;
if(document.getElementById("cauB").value.toLowerCase() === "sai") score++;
if(document.getElementById("cauC").value.toLowerCase() === "đúng") score++;

submitted = true;

document.getElementById("result").innerHTML =
`🎉 ${name} đạt ${score}/11 điểm`;
}
</script>

</body>
</html>
