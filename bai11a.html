<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 11A - Hệ Mặt Trời</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.screen{max-width:1000px;margin:auto;padding:20px}
.card{background:#020617;border-radius:20px;padding:25px;text-align:center}

input{padding:10px;border-radius:10px;border:none;margin:5px;width:200px}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}
.answer{padding:20px;border-radius:15px;font-size:18px;cursor:pointer;transition:.3s}

.a0{background:#ef4444}
.a1{background:#3b82f6}
.a2{background:#facc15;color:black}
.a3{background:#22c55e;color:black}

.zoomCorrect{transform:scale(1.15);box-shadow:0 0 20px #22c55e}
.zoomWrong{opacity:.3}

.progress{height:10px;background:#334155;border-radius:5px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;background:#22c55e;width:0%}

#circleBox{position:relative;width:120px;margin:auto}
#time{position:absolute;top:42px;left:0;width:120px;text-align:center;font-size:22px}

.correctBox{margin-top:10px;color:#22c55e;font-weight:bold}

button{padding:10px 25px;border-radius:10px;border:none;background:#22c55e;font-size:16px;cursor:pointer;margin-top:15px}
</style>
</head>

<body>

<div class="screen">

<div id="start" class="card">
<h2>🌞 BÀI 11A – HỆ MẶT TRỜI</h2>
<input id="name" placeholder="Tên học sinh">
<input id="cls" placeholder="Lớp"><br>
<button onclick="begin()">BẮT ĐẦU</button>
</div>

<div id="quiz" class="card" style="display:none">

<div class="progress"><div id="bar" class="bar"></div></div>

<div id="circleBox">
<svg width="120" height="120">
<circle cx="60" cy="60" r="50" stroke="#334155" stroke-width="8" fill="none"/>
<circle id="ring" cx="60" cy="60" r="50"
stroke="#22c55e" stroke-width="8"
stroke-dasharray="314" stroke-dashoffset="0"
fill="none"/>
</svg>
<div id="time">20</div>
</div>

<h3 id="question"></h3>
<div id="remain"></div>
<div class="answers" id="answers"></div>
<div id="correctBox" class="correctBox"></div>

</div>

<div id="end" class="card" style="display:none">
<h2>🎉 HOÀN THÀNH</h2>
<p id="result"></p>
<button onclick="location.reload()">LÀM LẠI</button>
</div>

</div>

<script>

let questions=[
["Hệ Mặt Trời gồm những gì?",["Mặt Trời và các hành tinh","Chỉ Trái Đất","Chỉ Mặt Trăng","Chỉ sao"],0],
["Hành tinh gần Mặt Trời nhất?",["Sao Thủy","Trái Đất","Sao Hỏa","Sao Mộc"],0],
["Hành tinh thứ hai từ Mặt Trời?",["Sao Kim","Sao Hỏa","Sao Thổ","Sao Mộc"],0],
["Chúng ta sống trên hành tinh nào?",["Trái Đất","Sao Kim","Sao Hỏa","Sao Thủy"],0],
["Hành tinh đỏ là?",["Sao Hỏa","Sao Thủy","Sao Kim","Sao Thổ"],0],
["Hành tinh lớn nhất?",["Sao Mộc","Trái Đất","Sao Hỏa","Sao Kim"],0],
["Hành tinh có vành đai?",["Sao Thổ","Sao Kim","Sao Hỏa","Sao Thủy"],0],
["Hành tinh xa nhất?",["Sao Hải Vương","Sao Kim","Trái Đất","Sao Hỏa"],0],
["Phần mềm tìm hiểu hệ mặt trời?",["SolarSystem","Word","Paint","Excel"],0],
["Mở SolarSystem bằng cách?",["Nháy đúp biểu tượng","Nhấn Delete","Nhấn Enter","Nhấn Shift"],0],
["Muốn tìm hiểu Trái Đất nháy vào?",["Earth","Sun","Mars","Jupiter"],0],
["Muốn tìm hiểu Mặt Trời nháy vào?",["Sun","Earth","Moon","Mars"],0],
["Các hành tinh quay quanh?",["Mặt Trời","Trái Đất","Sao Kim","Sao Hỏa"],0],
["Trái Đất quay quanh?",["Mặt Trời","Mặt Trăng","Sao Hỏa","Sao Kim"],0],
["Mặt Trăng quay quanh?",["Trái Đất","Mặt Trời","Sao Mộc","Sao Thổ"],0],
["Nút quan sát quỹ đạo hành tinh?",["ORBIT","SAVE","OPEN","EXIT"],0],
["SolarSystem là phần mềm?",["Mô phỏng","Soạn thảo","Vẽ","Âm nhạc"],0],
["Trái Đất là hành tinh thứ mấy?",["Thứ 3","Thứ 1","Thứ 5","Thứ 8"],0],
["Hệ Mặt Trời có bao nhiêu hành tinh?",["8","3","5","10"],0],
["Vệ tinh của Trái Đất?",["Mặt Trăng","Sao Hỏa","Sao Kim","Sao Thủy"],0]
];

questions.sort(()=>Math.random()-0.5)

let current=0
let score=0
let time=20
let timer

function shuffle(arr){
return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1])
}

function begin(){
start.style.display="none"
quiz.style.display="block"
loadQuestion()
}

function loadQuestion(){

if(current>=questions.length){
finish()
return
}

bar.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

remain.innerText="Còn "+(questions.length-current)+" câu"

let answersData=[...questions[current][1]].map((a,i)=>({text:a,index:i}))
answersData=shuffle(answersData)

answers.innerHTML=""
correctBox.innerHTML=""

answersData.forEach((a,k)=>{
answers.innerHTML+=`<div class="answer a${k}" onclick="selectAnswer(${a.index},this)">${a.text}</div>`
})

startTimer()
}

function startTimer(){

clearInterval(timer)
time=20
timeEl.innerText=time

timer=setInterval(()=>{
time--
timeEl.innerText=time

if(time<=0){
clearInterval(timer)
showAnswer(null)
}

},1000)

}

const timeEl=document.getElementById("time")

function selectAnswer(index,element){

clearInterval(timer)

showAnswer(index,element)

}

function showAnswer(index,element){

let correct=questions[current][2]
let correctText=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{
if(el.innerText===correctText) el.classList.add("zoomCorrect")
else el.classList.add("zoomWrong")
})

if(index===correct) score++

correctBox.innerText="👉 Câu trả lời đúng là: "+correctText

setTimeout(()=>{
current++
loadQuestion()
},1500)

}

function finish(){

quiz.style.display="none"
end.style.display="block"

let n=name.value||"HS"
let c=cls.value||""

result.innerText=n+" ("+c+") đạt "+score+"/"+questions.length+" điểm"

}

</script>

</body>
</html>
