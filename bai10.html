<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quiz Classroom PRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#eef4ff;
margin:0;
text-align:center
}

.card{
max-width:900px;
margin:auto;
margin-top:20px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15)
}

input{
padding:10px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
width:220px
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px
}

.answer{
padding:18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.25s;
font-weight:bold
}

.answer:hover{
transform:scale(1.05)
}

.a0{background:#ff7675}
.a1{background:#74b9ff}
.a2{background:#ffeaa7}
.a3{background:#55efc4}

.correct{
background:#2ecc71!important;
transform:scale(1.15)
}

.wrong{
opacity:.3
}

.timer{
font-size:24px;
color:#e74c3c;
font-weight:bold
}

#progressBar{
width:100%;
height:12px;
background:#ddd;
border-radius:10px;
margin-top:15px;
overflow:hidden
}

#progress{
height:100%;
width:0%;
background:#2ecc71
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:10px;
background:#0984e3;
color:white;
cursor:pointer
}

button:hover{
background:#0652dd
}

canvas{
max-width:300px;
margin-top:20px
}

/* mobile */

@media(max-width:600px){

.answers{
grid-template-columns:1fr
}

.answer{
font-size:16px
}

}

</style>
</head>

<body>

<div class="card">

<h2>Quiz Tin học 3 - Bài 10 - Trang tính</h2>

<input id="name" placeholder="Họ tên học sinh">
<br><br>

<input id="class" placeholder="Lớp">
<br><br>

<button onclick="start()">BẮT ĐẦU</button>

<div id="quiz" style="display:none">

<div class="timer" id="time">30:00</div>

<div id="progressBar">
<div id="progress"></div>
</div>

<h3 id="question"></h3>

<div class="answers" id="answers"></div>

<div id="correctText"></div>

</div>

<div id="result"></div>

<canvas id="chart"></canvas>

</div>

<audio id="correctSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b0f4d2c03.mp3"></audio>
<audio id="wrongSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d30a3c0d2.mp3"></audio>

<script>

let studentName=""
let studentClass=""

let questions=[

["Bạn Chi dùng phần mềm nào để giới thiệu bản thân?",
["Paint","Word","PowerPoint","Chrome"],2],

["Trang trình chiếu có thể chứa dạng thông tin nào?",
["Chỉ chữ","Chữ và hình ảnh","Chỉ âm thanh","Chỉ video"],1],

["Để khởi động PowerPoint ta làm gì?",
["Nhấn Ctrl","Nhấn Enter","Nháy đúp biểu tượng PowerPoint","Nhấn Alt"],2],

["Biểu tượng PowerPoint thường ở đâu?",
["Bàn phím","Chuột","Màn hình nền","Ổ đĩa"],2],

["Thanh chứa các mục File, Home, Insert gọi là gì?",
["Thanh công cụ","Bảng chọn các thẻ","Thanh trạng thái","Thanh tìm kiếm"],1],

["Để nhập chữ vào trang chiếu cần làm gì?",
["Nháy vào nền","Nháy vào khung văn bản","Nháy vào hình","Nháy vào menu"],1],

["Sau khi nháy vào khung văn bản xuất hiện gì?",
["Chuột","Con trỏ soạn thảo","Bàn phím","Hình ảnh"],1],

["Con trỏ soạn thảo có dạng gì?",
["-","|","+","*"],1],

["Phím nào dùng để viết chữ hoa?",
["Ctrl","Shift","Alt","Tab"],1],

["Phím Backspace dùng để làm gì?",
["Chèn hình","Xóa kí tự trước con trỏ","Xóa toàn bộ","Chèn chữ"],1],

["Để chèn hình ảnh vào trang chiếu chọn thẻ nào?",
["Insert","Home","View","Design"],0],

["Sau khi chọn Insert cần chọn gì?",
["Font","Pictures","Layout","Slide"],1],

["Sau khi chọn Pictures cần làm gì?",
["Chọn tệp ảnh","Tắt máy","Đổi nền","Chạy chương trình"],0],

["Sau khi chọn ảnh cần nhấn gì?",
["Save","Insert","Delete","Close"],1],

["Để thay đổi kích thước hình ảnh cần làm gì?",
["Nhấn Ctrl","Nhấn Enter","Kéo nút tròn","Nhấn Delete"],2],

["Có bao nhiêu nút tròn quanh hình ảnh?",
["6","4","8","10"],2],

["Để di chuyển hình ảnh cần làm gì?",
["Nhấn Tab","Kéo thả hình","Nhấn Enter","Nhấn Esc"],1],

["Nhấn phím F5 để làm gì?",
["Lưu tệp","Trình chiếu toàn màn hình","Thoát","Xóa"],1],

["Phím ESC dùng để làm gì?",
["Chèn ảnh","Lưu","Thoát trình chiếu","Xóa"],2],

["Để lưu bài trình chiếu nháy vào gì?",
["Insert","Save","Home","View"],1],

["Khi lưu lần đầu cần làm gì?",
["Chọn thư mục","Xóa tệp","Đổi màu","Chạy chương trình"],0],

["Sau khi chọn thư mục cần làm gì?",
["Gõ tên tệp","Xóa tệp","Đóng","Thoát"],0],

["Cuối cùng nháy gì để lưu?",
["Insert","Close","Save","Delete"],2],

["Để mở lại bài trình chiếu cần vào đâu?",
["File","Insert","Home","View"],0],

["Sau đó chọn gì?",
["Open","Save","Delete","Close"],0],

["Sau đó cần làm gì?",
["Chọn tệp","Xóa tệp","Đổi màu","Chạy"],0],

["Sau đó nháy gì?",
["Delete","Save","Open","Close"],2],

["Trang trình chiếu dùng để làm gì?",
["Trình bày thông tin","Chơi game","Nghe nhạc","Xem phim"],0],

["Hình ảnh giúp bài trình chiếu như thế nào?",
["Sinh động hơn","Chậm hơn","Tối hơn","Nhỏ hơn"],0],

["Phần mềm PowerPoint thuộc loại gì?",
["Phần mềm vẽ","Phần mềm trình chiếu","Phần mềm nghe nhạc","Phần mềm chơi game"],1],

["Bài 10 dạy học sinh điều gì?",
["Chơi game","Tạo trang trình chiếu","Nghe nhạc","Vẽ tranh"],1]

];

questions.sort(()=>Math.random()-0.5)

let current=0
let correctCount=0
let wrongCount=0
let totalTime=1800
let timer

function start(){

studentName=document.getElementById("name").value.trim()
studentClass=document.getElementById("class").value.trim()

if(studentName==""||studentClass==""){
alert("Nhập tên và lớp")
return
}

quiz.style.display="block"

startTimer()

load()

}

function startTimer(){

timer=setInterval(()=>{

totalTime--

let m=Math.floor(totalTime/60)
let s=totalTime%60

time.innerText=
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0')

if(totalTime<=0){
finish()
}

},1000)

}

function load(){

correctText.innerText=""

progress.style.width=(current/questions.length*100)+"%"

question.innerText="Câu "+(current+1)+": "+questions[current][0]

let ans=questions[current][1]
.map((a,i)=>({t:a,i}))
.sort(()=>Math.random()-0.5)

answers.innerHTML=""

ans.forEach((a,k)=>{

answers.innerHTML+=
`<div class="answer a${k}" onclick="choose(${a.i})">${a.t}</div>`

})

}

function choose(i){

let correct=questions[current][2]
let correctAns=questions[current][1][correct]

document.querySelectorAll(".answer").forEach(el=>{

if(el.innerText===correctAns)
el.classList.add("correct")
else
el.classList.add("wrong")

})

if(i===correct){
correctCount++
correctSound.play()
}else{
wrongCount++
wrongSound.play()
}

correctText.innerText="Đáp án đúng: "+correctAns

setTimeout(()=>{

current++

if(current<questions.length){
load()
}else{
finish()
}

},1200)

}

function finish(){

clearInterval(timer)

quiz.style.display="none"

let total=questions.length
let percent=Math.round(correctCount/total*100)

let grade=""

if(percent>=80) grade="Giỏi"
else if(percent>=65) grade="Khá"
else if(percent>=50) grade="Trung bình"
else grade="Cần cố gắng"

result.innerHTML=

"<h2>Hoàn thành bài</h2>"+
"<p>Học sinh: "+studentName+"</p>"+
"<p>Lớp: "+studentClass+"</p>"+
"<h3>Đúng: "+correctCount+"</h3>"+
"<h3>Sai: "+wrongCount+"</h3>"+
"<h3>Tỷ lệ: "+percent+"%</h3>"+
"<h3>Xếp loại: "+grade+"</h3>"+
"<br><button onclick='location.reload()'>Làm lại bài</button>"

drawChart()

}

function drawChart(){

let c=document.getElementById("chart")
let ctx=c.getContext("2d")

let total=correctCount+wrongCount

let correctAngle=(correctCount/total)*2*Math.PI

ctx.clearRect(0,0,300,300)

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,0,correctAngle)
ctx.fillStyle="#2ecc71"
ctx.fill()

ctx.beginPath()
ctx.moveTo(150,150)
ctx.arc(150,150,120,correctAngle,2*Math.PI)
ctx.fillStyle="#e74c3c"
ctx.fill()

}

</script>

</body>
</html>
